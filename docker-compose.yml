services:
  backend:
    build: ./Backend
    container_name: greenweb_backend
    init: true
    environment:
      - PORT=3000
      - NODE_ENV=production
      - TRUST_PROXY=true
    expose:
      - "3000"
    networks:
      - greenweb_net

  frontend:
    build: ./Frontend
    container_name: greenweb_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - greenweb_net

networks:
  greenweb_net:
    driver: bridge
